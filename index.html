<style>



  #intro-splash {



    /* Velocidad por defecto (1 = Normal) */



    --speed: 1; 



    



    position: fixed; inset: 0; z-index: 99999;



    display: flex; align-items: center; justify-content: center;



    background: #272c64; 



    background-image:



      radial-gradient(ellipse 60% 60% at 80% 15%, rgba(164,206,37,.10) 0%, transparent 60%),



      radial-gradient(ellipse 60% 60% at 15% 85%, rgba(164,206,37,.08) 0%, transparent 60%);



    transition: opacity calc(0.5s * var(--speed)) ease, visibility calc(0.5s * var(--speed)) ease;



    overflow: hidden;



  }



  



  /* Clase que se añade por JS si el usuario ya vio la intro */



  #intro-splash.fast-mode {



    --speed: 0.3; /* 3.3x más rápido (aprox 1 segundo en total) */



  }



  



  #intro-splash.intro-hide { opacity: 0; visibility: hidden; pointer-events: none; }







  .splash-wrapper {



    display: flex;



    flex-direction: column;



    align-items: flex-end; 



  }







  .main-content-block {



    display: flex;



    align-items: center;



  }







  .text-column {



    display: flex;



    flex-direction: column;



    align-items: flex-start;



    line-height: 0.95; 



  }







  .intro-word {



    position: relative;



    display: flex;



    white-space: nowrap;



    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;



  }



  



  .intro-letter {



    font-size: clamp(34px, 8vw, 85px); 



    font-weight: 800;



    color: #ffffff; 



    letter-spacing: -2px;



    display: inline-block;



    white-space: pre; 



    opacity: 0;



    transform: translateX(var(--dx, 0px)) scale(2.4, 1.9) skewX(14deg);



    filter: blur(24px);



  }



  



  .intro-letter-animar {



    animation: introLetterForm calc(1.15s * var(--speed)) cubic-bezier(.32,.1,.2,1) forwards;



    animation-delay: calc((var(--i) * 50ms + 150ms) * var(--speed));



  }







  .intro-check {



    opacity: 0;



    width: clamp(40px, 9vw, 90px);



    height: clamp(40px, 9vw, 90px);



    margin-left: clamp(10px, 2vw, 20px);



    transform-origin: center;



    animation: popInCheck calc(0.6s * var(--speed)) cubic-bezier(0.34, 1.56, 0.64, 1) forwards;



    animation-delay: calc(1.1s * var(--speed)); 



  }







  .intro-sub {



    opacity: 0;



    font-family: 'DM Sans', system-ui, sans-serif;



    font-size: clamp(16px, 3.5vw, 32px);



    display: flex;



    align-items: center;



    gap: 6px;



    margin-top: 5px; 



    padding-right: clamp(15px, 5vw, 65px); 



    animation: fadeUpSub calc(0.6s * var(--speed)) ease forwards;



    animation-delay: calc(1.3s * var(--speed));



  }



  



  .by-text { color: #ffffff; font-weight: 300; }



  .liberty-text { color: #43b05c; font-weight: 600; letter-spacing: -0.5px; }



  



  .liberty-icon {



    width: clamp(30px, 6vw, 48px);



    height: auto;



    margin-left: 2px;



    transform: translateY(8px);



  }







  @keyframes introLetterForm {



    0%   { opacity: 0;   filter: blur(24px); transform: translateX(var(--dx,0px)) scale(2.4, 1.9) skewX(16deg); }



    12%  { opacity: 1;   filter: blur(12px); }



    42%  { filter: blur(6px);  transform: translateX(calc(var(--dx,0px) * .32)) scale(1.5, .55) skewX(-8deg); }



    62%  { filter: blur(2px);  transform: translateX(calc(var(--dx,0px) * .06)) scale(.72, 1.28) skewX(4deg); }



    80%  { filter: blur(0px);  transform: translateX(calc(var(--dx,0px) * -.015)) scale(1.1, .92) skewX(-1.5deg); }



    92%  { filter: blur(0px);  transform: translateX(0) scale(.96, 1.04) skewX(.5deg); }



    100% { opacity: 1; filter: blur(0px); transform: translateX(0) scale(1,1) skewX(0); }



  }







  @keyframes popInCheck {



    0% { transform: scale(0) rotate(-20deg); opacity: 0; }



    70% { transform: scale(1.15) rotate(5deg); opacity: 1; }



    100% { transform: scale(1) rotate(0); opacity: 1; }



  }







  @keyframes fadeUpSub {



    0% { transform: translateY(15px); opacity: 0; filter: blur(4px); }



    100% { transform: translateY(0); opacity: 1; filter: blur(0); }



  }



  



  @media (prefers-reduced-motion: reduce) {



    .intro-letter, .intro-letter-animar, .intro-check, .intro-sub { 



      animation: none !important; opacity: 1 !important; filter: none !important; transform: none !important; 



    }



  }



</style>
