<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPago — Sistema de Cobros Escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* 🌙 DARK MODE (Por Defecto) - Alta Gama Corporativa */
  --bg-main: #040914;
  --bg-solid: #0b111e;
  --bg-login: radial-gradient(circle at top right, #111827 0%, #030712 100%);
  --bg-surface: rgba(14, 21, 37, 0.65);
  --bg-surface-2: rgba(20, 28, 47, 0.8);
  --bg-sidebar: rgba(7, 11, 20, 0.5);
  
  --border-glow: rgba(255, 255, 255, 0.08);
  --border-active: rgba(59, 130, 246, 0.4);
  
  --ink: #f8fafc;
  --ink-2: #e2e8f0;
  --ink-3: #94a3b8;
  --ink-4: #64748b;
  
  --glass-light: rgba(255, 255, 255, 0.03);
  --glass-hover: rgba(255, 255, 255, 0.06);
  --glass-dark: rgba(0, 0, 0, 0.2);
  --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
  
  /* Colores de Acento (Se mantienen vibrantes en ambos) */
  --accent: #3b82f6;
  --accent-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
  --accent-glow: rgba(59, 130, 246, 0.15);
  --accent-light: rgba(59, 130, 246, 0.1);
  
  --green: #10b981;
  --green-glow: rgba(16, 185, 129, 0.15);
  --amber: #f59e0b;
  --amber-glow: rgba(245, 158, 11, 0.15);
  --red: #ef4444;
  --red-glow: rgba(239, 68, 68, 0.15);
  --purple: #8b5cf6;
  --purple-glow: rgba(139, 92, 246, 0.15);
  
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 20px;
  --glass-blur: blur(16px);
  --font: "Google Sans", "Montserrat", sans-serif;
  --sidebar-w: 260px;
  --header-h: 70px;
}

/* ☀️ LIGHT MODE - Elegante, limpio y legible */
:root[data-theme="light"] {
  --bg-main: #f1f5f9;
  --bg-solid: #ffffff;
  --bg-login: radial-gradient(circle at top right, #f8fafc 0%, #e2e8f0 100%);
  --bg-surface: rgba(255, 255, 255, 0.65);
  --bg-surface-2: rgba(255, 255, 255, 0.9);
  --bg-sidebar: rgba(255, 255, 255, 0.5);
  
  --border-glow: rgba(0, 0, 0, 0.08);
  --border-active: rgba(59, 130, 246, 0.5);
  
  --ink: #0f172a;
  --ink-2: #334155;
  --ink-3: #64748b;
  --ink-4: #94a3b8;
  
  --glass-light: rgba(0, 0, 0, 0.03);
  --glass-hover: rgba(0, 0, 0, 0.06);
  --glass-dark: rgba(255, 255, 255, 0.5);
  --shadow-glass: 0 8px 24px 0 rgba(0, 0, 0, 0.05);
}

html, body { 
  height: 100%; font-family: var(--font); background: var(--bg-main); 
  color: var(--ink); font-size: 14px; letter-spacing: -0.1px;
  line-height: 1.6; -webkit-font-smoothing: antialiased; overflow: hidden;
  transition: background 0.3s ease, color 0.3s ease;
}

/* ── LUCES AMBIENTALES CORPORATIVAS ── */
body::before, body::after {
  content: ''; position: fixed; width: 50vw; height: 50vh; border-radius: 50%;
  filter: blur(120px); opacity: 0.12; z-index: -1; pointer-events: none; 
  animation: floatAmbient 15s infinite alternate ease-in-out;
}
body::before { background: #3b82f6; top: -10%; left: -10%; }
body::after { background: #4f46e5; bottom: -10%; right: -10%; animation-delay: -7s; }
:root[data-theme="light"] body::before, :root[data-theme="light"] body::after { opacity: 0.18; }

@keyframes floatAmbient { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 30px) scale(1.1); } }

/* ── LAYOUT PRINCIPAL ── */
.app { display: flex; height: 100vh; overflow: hidden; background: transparent; }

/* ── SIDEBAR PREMIUM ── */
.sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--bg-sidebar); backdrop-filter: var(--glass-blur); display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border-glow); }
.sidebar-brand { padding: 24px 24px 20px; border-bottom: 1px solid var(--border-glow); }
.brand-logo { display: flex; align-items: center; gap: 12px; }
.brand-icon { width: 38px; height: 38px; background: var(--accent-gradient); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); flex-shrink: 0; color: white; }
.brand-name { font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: -.5px; }
.brand-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

.sidebar-nav { flex: 1; overflow-y: auto; padding: 20px 14px; }
.sidebar-nav::-webkit-scrollbar { width: 0; }
.nav-section-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-4); padding: 16px 12px 8px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--radius); cursor: pointer; transition: all .3s ease; color: var(--ink-3); font-size: 13.5px; font-weight: 500; margin-bottom: 4px; position: relative; }
.nav-item:hover { background: var(--glass-light); color: var(--ink); transform: translateX(3px); }
.nav-item.active { background: var(--accent-glow); color: var(--accent); font-weight: 600; border: 1px solid var(--border-active); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.1); }
:root[data-theme="light"] .nav-item.active { color: var(--accent); }
:root:not([data-theme="light"]) .nav-item.active { color: #fff; }
.nav-item .nav-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
.nav-badge { margin-left: auto; background: var(--accent-gradient); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; box-shadow: 0 2px 8px rgba(59,130,246,0.4); }

.sidebar-footer { border-top: 1px solid var(--border-glow); padding: 16px 14px; background: var(--glass-dark); }
.user-card { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius); transition: all 0.2s; }
.user-card:hover { background: var(--glass-light); }
.avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.avatar-admin { background: var(--accent-glow); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
:root[data-theme="light"] .avatar-admin { color: #2563eb; }
.avatar-user { background: var(--green-glow); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
:root[data-theme="light"] .avatar-user { color: #059669; }
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.logout-btn { font-size: 16px; color: var(--ink-4); cursor: pointer; padding: 6px; transition: color 0.15s; margin-left: auto; }
.logout-btn:hover { color: var(--red); }

/* ── MAIN CONTENT AREA ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { height: var(--header-h); background: var(--bg-sidebar); backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--border-glow); display: flex; align-items: center; padding: 0 32px; gap: 16px; flex-shrink: 0; }
.topbar-title { font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: -0.2px; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }

.content { flex: 1; overflow-y: auto; padding: 32px; animation: fadeIn 0.4s ease-out; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 20px; }

/* ── BOTONES CORPORATIVOS ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius); font-size: 13.5px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all .25s ease; font-family: var(--font); white-space: nowrap; }
.btn-primary { background: var(--accent-gradient); color: #fff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25); border: 1px solid rgba(255,255,255,0.1); }
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4); }
.btn-secondary { background: var(--glass-light); border-color: var(--border-glow); color: var(--ink); }
.btn-secondary:hover { background: var(--glass-hover); border-color: var(--ink-3); }
.btn-ghost { background: transparent; color: var(--ink-3); padding: 8px; border-radius: var(--radius); }
.btn-ghost:hover { background: var(--glass-light); color: var(--ink); }
.btn-danger { background: var(--red-glow); color: #f87171; border-color: rgba(239,68,68,0.2); }
:root[data-theme="light"] .btn-danger { color: #dc2626; }
.btn-danger:hover { background: rgba(239,68,68,0.25); }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: var(--radius-sm); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

/* ── TARJETAS GLASSMORPHISM ── */
.card { background: var(--bg-surface); backdrop-filter: var(--glass-blur); border: 1px solid var(--border-glow); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-glass); transition: border-color 0.3s; }
.card:hover { border-color: var(--ink-3); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.card-title { font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: -0.3px; }
.card-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* ── MÉTRICAS (FINANCIAL DASHBOARD) ── */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
.stat-card { background: linear-gradient(145deg, var(--bg-surface-2) 0%, var(--bg-surface) 100%); backdrop-filter: var(--glass-blur); border: 1px solid var(--border-glow); border-radius: var(--radius-lg); padding: 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-glass); transition: transform 0.3s; }
.stat-card:hover { transform: translateY(-4px); border-color: var(--ink-3); }
.stat-icon { width: 44px; height: 44px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--glass-light) !important; border: 1px solid var(--border-glow); }
.stat-label { font-size: 12px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: -1px; line-height: 1.1; }
.stat-meta { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.stat-meta.up { color: #34d399; font-weight: 600; }
:root[data-theme="light"] .stat-meta.up { color: #059669; }
.stat-meta.down { color: #f87171; font-weight: 600; }
:root[data-theme="light"] .stat-meta.down { color: #dc2626; }

/* ── TABLAS DE DATOS PROFESIONALES ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th { font-size: 11px; font-weight: 700; color: var(--ink-4); text-transform: uppercase; letter-spacing: 1px; padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border-glow); }
td { padding: 14px 16px; border-bottom: 1px solid var(--glass-light); font-size: 13.5px; color: var(--ink-2); vertical-align: middle; transition: background 0.2s; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--glass-light); color: var(--ink); }

/* ── BADGES LUMINOSOS ── */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.badge-green { background: var(--green-glow); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
:root[data-theme="light"] .badge-green { color: #059669; border-color: #059669; }
.badge-amber { background: var(--amber-glow); color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); }
:root[data-theme="light"] .badge-amber { color: #b45309; border-color: #b45309; }
.badge-red { background: var(--red-glow); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
:root[data-theme="light"] .badge-red { color: #dc2626; border-color: #dc2626; }
.badge-blue { background: var(--accent-glow); color: #60a5fa; border: 1px solid rgba(59,130,246,0.2); }
:root[data-theme="light"] .badge-blue { color: #2563eb; border-color: #2563eb; }
.badge-purple { background: var(--purple-glow); color: #a78bfa; border: 1px solid rgba(139,92,246,0.2); }
:root[data-theme="light"] .badge-purple { color: #7c3aed; border-color: #7c3aed; }
.badge-gray { background: var(--glass-light); color: var(--ink-3); border: 1px solid var(--border-glow); }

/* ── FORMULARIOS (GLASS) ── */
.form-group { margin-bottom: 18px; }
.form-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-3); margin-bottom: 8px; }
.form-input, .form-select, .form-textarea { width: 100%; padding: 11px 14px; border: 1px solid var(--border-glow); border-radius: var(--radius); font-size: 14px; font-family: var(--font); color: var(--ink); background: var(--glass-dark); transition: all 0.2s ease; outline: none; }
.form-select option { background: var(--bg-solid); color: var(--ink); }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); background: var(--bg-surface); }
.form-textarea { resize: vertical; min-height: 100px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* ── BÚSQUEDA ── */
.search-bar { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border: 1px solid var(--border-glow); border-radius: var(--radius); background: var(--glass-dark); transition: all 0.2s; }
.search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); background: var(--bg-surface); }
.search-bar input { border: none; outline: none; font-size: 13.5px; flex: 1; font-family: var(--font); background: transparent; color: var(--ink); }
.search-bar input::placeholder { color: var(--ink-4); }
.search-bar .search-icon { color: var(--ink-4); font-size: 16px; }

/* ── MODALES ── */
.modal-backdrop { position: fixed; inset: 0; background: rgba(2, 4, 10, 0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 24px; animation: fadeIn 0.2s ease-out; }
:root[data-theme="light"] .modal-backdrop { background: rgba(15, 23, 42, 0.5); }
.modal { background: var(--bg-solid); border: 1px solid var(--border-glow); border-radius: var(--radius-lg); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
:root[data-theme="light"] .modal { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); }
.modal-lg { max-width: 760px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 28px; border-bottom: 1px solid var(--border-glow); }
.modal-title { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: -0.2px; }
.modal-body { padding: 24px 28px; }
.modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 18px 28px; border-top: 1px solid var(--border-glow); background: var(--glass-dark); }

/* ── CAJA POS ── */
.pos-layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; height: calc(100vh - var(--header-h) - 64px); }
.pos-products, .pos-cart { background: var(--bg-surface); backdrop-filter: var(--glass-blur); border: 1px solid var(--border-glow); border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-glass); }
.pos-header { padding: 16px 20px; border-bottom: 1px solid var(--border-glow); display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: var(--glass-dark); }
.pos-products-grid { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; align-content: start; }

.product-card { background: var(--glass-light); border: 1px solid var(--border-glow); border-radius: var(--radius); padding: 16px 14px; cursor: pointer; transition: all 0.25s ease; display: flex; flex-direction: column; gap: 8px; position: relative; }
.product-card:hover { border-color: var(--accent); background: var(--accent-light); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
.product-emoji { font-size: 32px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); margin-bottom: 4px; }
.product-name { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.3; }
.product-type { font-size: 10px; color: var(--ink-4); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.product-price { font-size: 15px; font-weight: 700; color: #60a5fa; margin-top: auto; font-family: monospace; }
:root[data-theme="light"] .product-price { color: #2563eb; }

.cart-header { padding: 18px 20px; border-bottom: 1px solid var(--border-glow); flex-shrink: 0; }
.cart-customer { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--glass-light); border-radius: var(--radius); border: 1px solid var(--border-glow); cursor: pointer; transition: all 0.2s; }
.cart-customer:hover { border-color: var(--ink-3); background: var(--glass-hover); }
.cart-items { flex: 1; overflow-y: auto; padding: 16px 20px; }
.cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--glass-light); }
.cart-item:last-child { border-bottom: none; }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.cart-item-qty { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.qty-btn { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border-glow); background: var(--glass-light); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--ink); transition: all 0.2s; }
.qty-btn:hover { border-color: var(--accent); background: var(--accent); color: #fff; }
.qty-num { font-size: 13px; font-weight: 700; min-width: 20px; text-align: center; color: var(--ink); }
.cart-item-price { font-size: 14px; font-weight: 700; color: var(--ink); margin-left: auto; font-family: monospace; }
.cart-remove { color: var(--ink-4); cursor: pointer; font-size: 16px; padding: 4px; transition: color 0.15s; }
.cart-remove:hover { color: var(--red); }

.cart-totals { border-top: 1px solid var(--border-glow); padding: 18px 20px; flex-shrink: 0; background: var(--glass-dark); }
.totals-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-3); margin-bottom: 8px; }
.totals-total { font-size: 22px; font-weight: 700; color: var(--ink); margin-top: 4px; font-family: monospace; }

.payment-methods { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border-glow); flex-shrink: 0; }
.pay-method { padding: 12px 8px; border-radius: var(--radius); border: 1px solid var(--border-glow); cursor: pointer; text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-3); transition: all 0.2s; background: var(--glass-light); }
.pay-method:hover { border-color: var(--ink-3); color: var(--ink); }
.pay-method.selected { border-color: var(--accent); background: var(--accent-glow); color: var(--accent); box-shadow: 0 0 15px rgba(59,130,246,0.15); }
.pay-method .pm-icon { font-size: 22px; display: block; margin-bottom: 6px; }

.checkout-btn { margin: 0 20px 20px; padding: 16px; border-radius: var(--radius); background: var(--accent-gradient); color: #fff; border: 1px solid rgba(255,255,255,0.1); font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: all 0.2s; width: calc(100% - 40px); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
.checkout-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4); }
.checkout-btn:disabled { background: var(--glass-light); color: var(--ink-4); cursor: not-allowed; box-shadow: none; border-color: transparent; }

/* ── PÍLDORAS / TABS ── */
.tabs { display: flex; gap: 4px; background: var(--glass-dark); padding: 4px; border-radius: 10px; width: fit-content; border: 1px solid var(--border-glow); }
.tab { padding: 6px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-3); transition: all 0.2s; }
.tab:hover { color: var(--ink); }
.tab.active { background: var(--bg-surface-2); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

/* ── LOGIN CORPORATIVO PREMIUM ── */
.login-screen { position: fixed; inset: 0; background: var(--bg-login); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.login-card { background: var(--bg-surface); border: 1px solid var(--border-glow); border-radius: 24px; padding: 48px 40px; width: 420px; backdrop-filter: blur(24px); box-shadow: 0 30px 60px rgba(0,0,0,0.4); animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
:root[data-theme="light"] .login-card { box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
.login-logo { text-align: center; margin-bottom: 40px; }
.login-brand { font-size: 28px; font-weight: 800; color: var(--ink); letter-spacing: -0.5px; }
.login-tagline { font-size: 13px; color: var(--ink-4); margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }
.login-input { width: 100%; padding: 14px 16px; background: var(--glass-dark); border: 1px solid var(--border-glow); border-radius: 12px; font-size: 14px; color: var(--ink); font-family: var(--font); outline: none; transition: all .2s; }
.login-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); background: var(--bg-solid); }
.login-label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.login-btn { width: 100%; padding: 14px; background: var(--accent-gradient); color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--font); margin-top: 24px; transition: all .2s; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.5); }
.login-demo { display: flex; gap: 12px; margin-top: 24px; }
.demo-pill { flex: 1; padding: 10px; background: var(--glass-light); border: 1px solid var(--border-glow); border-radius: 10px; text-align: center; cursor: pointer; font-size: 12px; color: var(--ink-3); transition: all .2s; font-weight: 600; }
.demo-pill:hover { background: var(--glass-hover); color: var(--ink); border-color: var(--ink-3); }

/* ── TICKET / RECIBO ── */
.ticket { font-family: monospace; font-size: 13px; width: 100%; max-width: 340px; margin: 0 auto; border: 1px dashed var(--border-glow); border-radius: var(--radius); padding: 24px; background: var(--bg-solid); box-shadow: 0 10px 25px rgba(0,0,0,0.2); color: var(--ink); }
.ticket-divider { border: none; border-top: 1px dashed var(--border-glow); margin: 12px 0; }

/* ── BARRAS DE PROGRESO / GRÁFICOS ── */
.bar-chart { display: flex; flex-direction: column; gap: 16px; }
.bar-row { display: flex; align-items: center; gap: 14px; }
.bar-label { font-size: 13px; color: var(--ink-2); font-weight: 500; min-width: 120px; }
.bar-track { flex: 1; height: 8px; background: var(--glass-light); border-radius: 20px; overflow: hidden; border: 1px solid var(--border-glow); }
.bar-fill { height: 100%; border-radius: 20px; background: var(--accent-gradient); transition: width 1s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 0 10px var(--accent); }
.bar-val { font-size: 13px; color: var(--ink); font-weight: 700; min-width: 80px; text-align: right; font-family: monospace; }

/* ── ANIMACIONES DE TRANSICIÓN ── */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ── CLASES AUXILIARES EXTRA ── */
.empty-state { text-align: center; padding: 48px 24px; color: var(--ink-4); }
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.8; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
.empty-text { font-size: 15px; font-weight: 600; color: var(--ink-2); }
.empty-sub { font-size: 13px; margin-top: 6px; }
.divider { border: none; border-top: 1px solid var(--border-glow); margin: 20px 0; }
.text-right { text-align: right; }
.text-mono { font-family: monospace; font-weight: 600; color: #60a5fa; }
:root[data-theme="light"] .text-mono { color: #2563eb; }
.flex-center { display: flex; align-items: center; gap: 10px; }
.ml-auto { margin-left: auto; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
.mb-16 { margin-bottom: 16px; }
.mb-24 { margin-bottom: 24px; }
</style>

/* ── HELPERS ── */
const fmt = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n);
const fmtDate = d => new Date(d+'T12:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
const newId = arr => Math.max(0,...arr.map(x=>x.id))+1;
const newFolio = arr => 'COB-'+String(newId(arr)).padStart(4,'0');

function EstadoBadge({estado}){
  const map = { pagado:'badge-green', pendiente:'badge-amber', cancelado:'badge-red', vencido:'badge-red' };
  return <span className={`badge ${map[estado]||'badge-gray'}`}>{estado}</span>;
}
function MetodoBadge({metodo}){
  const map = { TC:'badge-blue', SPEI:'badge-purple', CoDi:'badge-green', Efectivo:'badge-gray' };
  return <span className={`badge ${map[metodo]||'badge-gray'}`}>{metodo}</span>;
}

function Login({onLogin}){
  const [u,setU]=useState('');
  const [p,setP]=useState('');
  const [err,setErr]=useState('');
  const users=[
    {email:'admin@escuela.mx',pass:'admin123',nombre:'Dr. Ramírez',rol:'admin'},
    {email:'cajero@escuela.mx',pass:'cajero123',nombre:'María Soto',rol:'cajero'},
  ];
  const submit=e=>{
    e.preventDefault();
    const found=users.find(x=>x.email===u&&x.pass===p);
    if(found) onLogin(found);
    else setErr('Credenciales incorrectas');
  };
  return(
    <div className="login-screen">

/* ══════════════════════════════════════
   DASHBOARD
══════════════════════════════════════ */
function Dashboard({data,user}){
  const cobrados=data.cobros.filter(c=>c.estado==='pagado').reduce((a,c)=>a+c.total,0);
  const pendiente=data.cobros.filter(c=>c.estado==='pendiente').reduce((a,c)=>a+c.total,0);
  const hoy=data.cobros.filter(c=>c.fecha===new Date().toISOString().slice(0,10));
  const recientes=data.cobros.slice(-5).reverse();
  const metodos=[
    {nombre:'Tarjeta de crédito',val:data.cobros.filter(c=>c.metodo==='TC').reduce((a,c)=>a+c.total,0),pct:52},
    {nombre:'SPEI',val:data.cobros.filter(c=>c.metodo==='SPEI').reduce((a,c)=>a+c.total,0),pct:32},
    {nombre:'CoDi',val:data.cobros.filter(c=>c.metodo==='CoDi').reduce((a,c)=>a+c.total,0),pct:16},
  ];
  return(
    <div>
      <div className="stats-grid">
        {[
          {label:'Cobrado este mes',val:fmt(cobrados),icon:'💰',bg:'#eff4ff',meta:'↑ 12% vs mes anterior',cls:'up'},
          {label:'Pendiente',val:fmt(pendiente),icon:'⏳',bg:'#fffbeb',meta:`${data.cobros.filter(c=>c.estado==='pendiente').length} cobros`},
          {label:'Alumnos activos',val:data.clientes.filter(c=>c.activo).length,icon:'👥',bg:'#ecfdf5',meta:`${data.clientes.filter(c=>c.tipo==='familia').length} familias`},
          {label:'Cobros hoy',val:hoy.length||0,icon:'📋',bg:'#f5f3ff',meta:fmt(hoy.reduce((a,c)=>a+c.total,0))},
        ].map((s,i)=>(
          <div className="stat-card" key={i}>
            <div className="stat-icon" style={{background:s.bg}}>{s.icon}</div>
            <div className="stat-label">{s.label}</div>
            <div className="stat-value">{s.val}</div>
            {s.meta&&<div className={`stat-meta ${s.cls||''}`}>{s.meta}</div>}
          </div>
        ))}
      </div>
      <div className="grid-2">
        <div className="card">
          <div className="card-header">
            <div><div className="card-title">Cobros recientes</div><div className="card-sub">Últimos movimientos</div></div>
          </div>
          <div className="table-wrap">
            <table>
              <thead><tr><th>Cliente</th><th>Total</th><th>Método</th><th>Estado</th></tr></thead>
              <tbody>{recientes.map(c=>(
                <tr key={c.id}>
                  <td><div style={{fontWeight:500,color:'var(--ink)'}}>{c.cliente}</div><div style={{fontSize:11.5,color:'var(--ink-3)'}}>{c.folio}</div></td>
                  <td className="text-mono">{fmt(c.total)}</td>
                  <td><MetodoBadge metodo={c.metodo}/></td>
                  <td><EstadoBadge estado={c.estado}/></td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        </div>
        <div className="card">
          <div className="card-header"><div><div className="card-title">Métodos de pago</div><div className="card-sub">Distribución del mes</div></div></div>
          <div className="bar-chart" style={{marginTop:8}}>
            {metodos.map((m,i)=>(
              <div className="bar-row" key={i}>
                <div className="bar-label" style={{textAlign:'left',minWidth:120}}>{m.nombre}</div>
                <div className="bar-track"><div className="bar-fill" style={{width:m.pct+'%'}}/></div>
                <div className="bar-val">{fmt(m.val)}</div>
              </div>
            ))}
          </div>
          <hr className="divider"/>
          <div>
            <div style={{fontSize:12,color:'var(--ink-3)',marginBottom:8}}>Alumnos con saldo pendiente</div>
            {data.clientes.filter(c=>c.saldo_pendiente>0).map(c=>(

                <span style={{color:'var(--red)',fontFamily:'var(--mono)',fontWeight:600}}>{fmt(c.saldo_pendiente)}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   CLIENTES
══════════════════════════════════════ */
function Clientes({data,setData}){
  const [q,setQ]=useState('');
  const [tab,setTab]=useState('todos');
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({nombre:'',tipo:'alumno',grado:'',curp:'',email:'',tel:''});

  const list=data.clientes.filter(c=>{
    if(tab!=='todos'&&c.tipo!==tab) return false;
    if(q&&!c.nombre.toLowerCase().includes(q.toLowerCase())&&!c.email.toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });

  const save=()=>{
    if(modal==='new'){
      setData(d=>({...d,clientes:[...d.clientes,{...form,id:newId(d.clientes),saldo_pendiente:0,activo:true}]}));
    } else {
      setData(d=>({...d,clientes:d.clientes.map(c=>c.id===modal?{...c,...form}:c)}));
    }
    setModal(null);
  };
  const openNew=()=>{ setForm({nombre:'',tipo:'alumno',grado:'',curp:'',email:'',tel:''}); setModal('new'); };
  const openEdit=c=>{ setForm({nombre:c.nombre,tipo:c.tipo,grado:c.grado,curp:c.curp,email:c.email,tel:c.tel}); setModal(c.id); };

  return(
    <div>
      <div className="flex-center mb-16">
        <div className="tabs">
          {['todos','alumno','familia'].map(t=><div key={t} className={`tab ${tab===t?'active':''}`} onClick={()=>setTab(t)}>{t==='todos'?'Todos':t==='alumno'?'Alumnos':'Familias'}</div>)}
        </div>
        <div className="ml-auto flex-center" style={{gap:8}}>
          <div className="search-bar" style={{width:240}}>
            <span className="search-icon">🔍</span>
            <input placeholder="Buscar cliente..." value={q} onChange={e=>setQ(e.target.value)}/>
          </div>
          <button className="btn btn-primary" onClick={openNew}>+ Nuevo cliente</button>
        </div>
      </div>
      <div className="card">
        <div className="table-wrap">
          <table>
            <thead><tr><th>Nombre</th><th>Tipo</th><th>Grado</th><th>Email</th><th>Teléfono</th><th>Saldo pendiente</th><th>Estado</th><th></th></tr></thead>
            <tbody>
              {list.length===0&&<tr><td colSpan={8}><div className="empty-state"><div className="empty-icon">👥</div><div className="empty-text">Sin resultados</div></div></td></tr>}
              {list.map(c=>(
                <tr key={c.id}>
                  <td style={{fontWeight:500,color:'var(--ink)'}}>{c.nombre}</td>
                  <td><span className={`badge ${c.tipo==='alumno'?'badge-blue':'badge-purple'}`}>{c.tipo==='alumno'?'Alumno':'Familia'}</span></td>
                  <td>{c.grado||'—'}</td>
                  <td style={{color:'var(--ink-3)',fontSize:12.5}}>{c.email}</td>
                  <td style={{fontFamily:'var(--mono)',fontSize:12.5}}>{c.tel}</td>
                  <td><span style={{fontFamily:'var(--mono)',color:c.saldo_pendiente>0?'var(--red)':'var(--green)',fontWeight:c.saldo_pendiente>0?600:400}}>{fmt(c.saldo_pendiente)}</span></td>
                  <td><span className={`badge ${c.activo?'badge-green':'badge-gray'}`}>{c.activo?'Activo':'Inactivo'}</span></td>
                  <td><button className="btn btn-ghost btn-sm" onClick={()=>openEdit(c)}>✏️</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      {modal&&(
        <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal">
            <div className="modal-header">
              <div className="modal-title">{modal==='new'?'Nuevo cliente':'Editar cliente'}</div>
              <button className="btn btn-ghost btn-sm" onClick={()=>setModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="form-group">
                <label className="form-label">Tipo de cliente</label>
                <div style={{display:'flex',gap:8}}>
                  {['alumno','familia'].map(t=>(
                    <div key={t} onClick={()=>setForm(f=>({...f,tipo:t}))}
                      style={{flex:1,padding:'8px 12px',borderRadius:6,border:`1.5px solid ${form.tipo===t?'var(--accent)':'var(--border-2)'}`,background:form.tipo===t?'var(--accent-light)':'var(--surface)',cursor:'pointer',textAlign:'center',fontSize:13,fontWeight:500,color:form.tipo===t?'var(--accent)':'var(--ink-3)'}}>
                      {t==='alumno'?'👤 Alumno':'👨‍👩‍👧 Familia'}
                    </div>
                  ))}
                </div>
              </div>
              <div className="form-row">
                <div className="form-group"><label className="form-label">Nombre completo *</label><input className="form-input" value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))} placeholder="Nombre y apellidos"/></div>
                <div className="form-group"><label className="form-label">Grado / nivel</label><input className="form-input" value={form.grado} onChange={e=>setForm(f=>({...f,grado:e.target.value}))} placeholder="Ej: 3° Primaria"/></div>
              </div>
              <div className="form-group"><label className="form-label">CURP</label><input className="form-input" value={form.curp} onChange={e=>setForm(f=>({...f,curp:e.target.value.toUpperCase()}))} placeholder="18 caracteres" maxLength={18}/></div>
              <div className="form-row">
                <div className="form-group"><label className="form-label">Email *</label><input className="form-input" type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="correo@ejemplo.com"/></div>
                <div className="form-group"><label className="form-label">Teléfono</label><input className="form-input" value={form.tel} onChange={e=>setForm(f=>({...f,tel:e.target.value}))} placeholder="10 dígitos"/></div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setModal(null)}>Cancelar</button>
              <button className="btn btn-primary" onClick={save} disabled={!form.nombre||!form.email}>Guardar cliente</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════
   PRODUCTOS (CONCEPTOS DE PAGO)
══════════════════════════════════════ */
function Productos({data,setData}){
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({nombre:'',categoria:'colegiatura',precio:'',descripcion:'',emoji:'📋'});
  const cats=['colegiatura','anualidad','beca','inscripcion','uniforme','material','transporte','comedor','otro'];
  const emojis=['📚','🎯','🏆','✏️','👕','📖','🚌','🍽️','💳','📋','🎓','📐'];

  const save=()=>{
    const p={...form,precio:parseFloat(form.precio)||0};
    if(modal==='new') setData(d=>({...d,productos:[...d.productos,{...p,id:newId(d.productos),activo:true}]}));
    else setData(d=>({...d,productos:d.productos.map(x=>x.id===modal?{...x,...p}:x)}));
    setModal(null);
  };
  const openNew=()=>{ setForm({nombre:'',categoria:'colegiatura',precio:'',descripcion:'',emoji:'📋'}); setModal('new'); };
  const openEdit=p=>{ setForm({nombre:p.nombre,categoria:p.categoria,precio:p.precio,descripcion:p.descripcion,emoji:p.emoji}); setModal(p.id); };

  return(
    <div>
      <div className="flex-center mb-16">
        <div style={{fontSize:13,color:'var(--ink-3)'}}>{data.productos.length} conceptos de pago</div>
        <div className="ml-auto"><button className="btn btn-primary" onClick={openNew}>+ Nuevo concepto</button></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:12}}>
        {data.productos.map(p=>(
          <div key={p.id} className="card" style={{opacity:p.activo?1:.5}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
              <span style={{fontSize:28}}>{p.emoji}</span>
              <span className={`badge ${p.activo?'badge-green':'badge-gray'}`}>{p.activo?'Activo':'Inactivo'}</span>
            </div>
            <div style={{fontWeight:600,fontSize:14,color:'var(--ink)',marginBottom:3}}>{p.nombre}</div>
            <div style={{fontSize:11.5,color:'var(--ink-3)',marginBottom:8}}>{p.descripcion}</div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{fontFamily:'var(--mono)',fontWeight:700,fontSize:16,color:p.precio<0?'var(--green)':'var(--accent)'}}>{fmt(p.precio)}</span>
              <button className="btn btn-ghost btn-sm" onClick={()=>openEdit(p)}>✏️</button>
            </div>
            <div style={{marginTop:8}}><span className="tag">{p.categoria}</span></div>
          </div>
        ))}
      </div>
      {modal&&(
        <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal">
            <div className="modal-header"><div className="modal-title">{modal==='new'?'Nuevo concepto':'Editar concepto'}</div><button className="btn btn-ghost btn-sm" onClick={()=>setModal(null)}>✕</button></div>
            <div className="modal-body">
              <div className="form-group">
                <label className="form-label">Ícono</label>
                <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                  {emojis.map(em=><span key={em} onClick={()=>setForm(f=>({...f,emoji:em}))} style={{fontSize:22,cursor:'pointer',padding:4,borderRadius:6,background:form.emoji===em?'var(--accent-light)':'transparent',border:form.emoji===em?'1.5px solid var(--accent)':'1.5px solid transparent'}}>{em}</span>)}
                </div>
              </div>
              <div className="form-row">
                <div className="form-group"><label className="form-label">Nombre del concepto *</label><input className="form-input" value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))} placeholder="Ej: Colegiatura Mensual"/></div>
                <div className="form-group">
                  <label className="form-label">Categoría</label>
                  <select className="form-select" value={form.categoria} onChange={e=>setForm(f=>({...f,categoria:e.target.value}))}>
                    {cats.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>
              <div className="form-group"><label className="form-label">Precio (MXN) — negativo para descuentos</label><input className="form-input" type="number" value={form.precio} onChange={e=>setForm(f=>({...f,precio:e.target.value}))} placeholder="0.00"/></div>
              <div className="form-group"><label className="form-label">Descripción</label><textarea className="form-textarea" value={form.descripcion} onChange={e=>setForm(f=>({...f,descripcion:e.target.value}))} placeholder="Descripción opcional del concepto" rows={2}/></div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setModal(null)}>Cancelar</button>
              <button className="btn btn-primary" onClick={save} disabled={!form.nombre}>Guardar concepto</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════
   POS — CAJA DE COBROS
══════════════════════════════════════ */
function Caja({data,setData,user}){
  const [carrito,setCarrito]=useState([]);
  const [clienteSel,setClienteSel]=useState(null);
  const [metodo,setMetodo]=useState('TC');
  const [q,setQ]=useState('');
  const [showClientePicker,setShowClientePicker]=useState(false);
  const [showTicket,setShowTicket]=useState(null);
  const [showSPEI,setShowSPEI]=useState(false);
  const [showCoDi,setShowCoDi]=useState(false);

  const productosFiltrados=data.productos.filter(p=>p.activo&&(!q||p.nombre.toLowerCase().includes(q.toLowerCase())));
  const subtotal=carrito.reduce((a,i)=>a+i.precio*i.qty,0);
  const impuestos=Math.max(0,subtotal)*0.16;
  const total=subtotal;

  const addItem=p=>{
    setCarrito(prev=>{
      const ex=prev.find(i=>i.id===p.id);
      if(ex) return prev.map(i=>i.id===p.id?{...i,qty:i.qty+1}:i);
      return [...prev,{...p,qty:1}];
    });
  };
  const setQty=(id,qty)=>qty<1?setCarrito(prev=>prev.filter(i=>i.id!==id)):setCarrito(prev=>prev.map(i=>i.id===id?{...i,qty}:i));
  const removeItem=id=>setCarrito(prev=>prev.filter(i=>i.id!==id));

  const cobrar=()=>{
    if(!carrito.length) return;
    if(metodo==='SPEI'){ setShowSPEI(true); return; }
    if(metodo==='CoDi'){ setShowCoDi(true); return; }
    finalizarCobro();
  };

  const finalizarCobro=()=>{
    const cobro={
      id:newId(data.cobros), folio:newFolio(data.cobros),
      cliente_id:clienteSel?.id||null, cliente:clienteSel?.nombre||'Cliente general',
      items:carrito.map(i=>({nombre:i.nombre,qty:i.qty,precio:i.precio})),
      total, metodo, estado:'pagado', fecha:new Date().toISOString().slice(0,10), factura:false,
    };
    setData(d=>({...d,cobros:[...d.cobros,cobro]}));
    setShowTicket(cobro);
    setCarrito([]); setClienteSel(null); setShowSPEI(false); setShowCoDi(false);
  };

  const METODOS=[
    {id:'TC',label:'T. Crédito',icon:'💳'},
    {id:'SPEI',label:'SPEI',icon:'🏦'},
    {id:'CoDi',label:'CoDi',icon:'📱'},
  ];

  return(
    <div className="pos-layout">
      {/* Productos */}
      <div className="pos-products">
        <div className="pos-header">
          <span style={{fontWeight:600,fontSize:14}}>💡 Conceptos</span>
          <div className="search-bar" style={{flex:1,marginLeft:8}}>
            <span className="search-icon">🔍</span>
            <input placeholder="Buscar concepto..." value={q} onChange={e=>setQ(e.target.value)}/>
          </div>
        </div>
        <div className="pos-products-grid">
          {productosFiltrados.map(p=>(
            <div className="product-card" key={p.id} onClick={()=>addItem(p)}>
              <div className="product-emoji">{p.emoji}</div>
              <div className="product-name">{p.nombre}</div>
              <div className="product-type">{p.categoria}</div>
              <div className="product-price">{fmt(p.precio)}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Carrito */}
      <div className="pos-cart">
        <div className="cart-header">
          <div style={{fontWeight:600,fontSize:14,marginBottom:8}}>🧾 Cobro</div>
          <div className="cart-customer" onClick={()=>setShowClientePicker(true)}>
            <span style={{fontSize:18}}>{clienteSel?'👤':'👥'}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:500,color:'var(--accent)'}}>{clienteSel?.nombre||'Seleccionar cliente'}</div>
              {clienteSel&&<div style={{fontSize:11,color:'var(--ink-3)'}}>{clienteSel.tipo} · {clienteSel.grado||'—'}</div>}
            </div>
            <span style={{fontSize:12,color:'var(--accent)'}}>›</span>
          </div>
        </div>

        <div className="cart-items">
          {carrito.length===0&&(
            <div className="empty-state">
              <div className="empty-icon">🛒</div>
              <div className="empty-text">Sin conceptos</div>
              <div className="empty-sub">Selecciona conceptos de la izquierda</div>
            </div>
          )}
          {carrito.map(item=>(
            <div className="cart-item" key={item.id}>
              <span style={{fontSize:20}}>{item.emoji}</span>
              <div className="cart-item-info">
                <div className="cart-item-name">{item.nombre}</div>
                <div className="cart-item-qty">
                  <button className="qty-btn" onClick={()=>setQty(item.id,item.qty-1)}>−</button>
                  <span className="qty-num">{item.qty}</span>
                  <button className="qty-btn" onClick={()=>setQty(item.id,item.qty+1)}>+</button>
                </div>
              </div>
              <div style={{textAlign:'right'}}>
                <div className="cart-item-price">{fmt(item.precio*item.qty)}</div>
                <span className="cart-remove" onClick={()=>removeItem(item.id)}>✕</span>
              </div>
            </div>
          ))}
        </div>

        <div className="cart-totals">
          <div className="totals-row"><span>Subtotal</span><span className="text-mono">{fmt(total)}</span></div>
          <div className="totals-row" style={{fontWeight:600,fontSize:16,color:'var(--ink)',marginTop:4}}>
            <span>Total</span><span className="totals-total">{fmt(total)}</span>
          </div>
        </div>

        <div className="payment-methods">
          {METODOS.map(m=>(
            <div key={m.id} className={`pay-method ${metodo===m.id?'selected':''}`} onClick={()=>setMetodo(m.id)}>
              <span className="pm-icon">{m.icon}</span>{m.label}
            </div>
          ))}
        </div>

        <button className="checkout-btn" onClick={cobrar} disabled={!carrito.length}>
          {metodo==='TC'?'💳':'🏦'} Cobrar {fmt(total)}
        </button>
      </div>

      {/* Modal: seleccionar cliente */}
      {showClientePicker&&(
        <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&setShowClientePicker(false)}>
          <div className="modal">
            <div className="modal-header"><div className="modal-title">Seleccionar cliente</div><button className="btn btn-ghost btn-sm" onClick={()=>setShowClientePicker(false)}>✕</button></div>
            <div className="modal-body" style={{padding:'12px 22px'}}>
              {data.clientes.filter(c=>c.activo).map(c=>(
                <div key={c.id} onClick={()=>{setClienteSel(c);setShowClientePicker(false);}}
                  style={{display:'flex',alignItems:'center',gap:10,padding:'10px 8px',borderRadius:8,cursor:'pointer',borderBottom:'1px solid var(--surface-3)'}}>
                  <div className={`avatar ${c.tipo==='alumno'?'avatar-admin':'avatar-user'}`}>{c.nombre.charAt(0)}</div>
                  <div>
                    <div style={{fontWeight:500,fontSize:13,color:'var(--ink)'}}>{c.nombre}</div>
                    <div style={{fontSize:11.5,color:'var(--ink-3)'}}>{c.tipo} · {c.grado||'—'} · {c.email}</div>
                  </div>
                  {c.saldo_pendiente>0&&<span style={{marginLeft:'auto',color:'var(--red)',fontSize:12,fontFamily:'var(--mono)',fontWeight:600}}>{fmt(c.saldo_pendiente)}</span>}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Modal SPEI */}
      {showSPEI&&(
        <div className="modal-backdrop">
          <div className="modal">
            <div className="modal-header"><div className="modal-title">Pago por SPEI</div><button className="btn btn-ghost btn-sm" onClick={()=>setShowSPEI(false)}>✕</button></div>
            <div className="modal-body" style={{textAlign:'center'}}>
              <div style={{fontSize:13,color:'var(--ink-3)',marginBottom:16}}>El cliente debe transferir a la siguiente CLABE:</div>
              <div style={{background:'var(--surface-2)',borderRadius:10,padding:'16px 20px',marginBottom:16}}>
                <div style={{fontFamily:'var(--mono)',fontSize:20,fontWeight:700,letterSpacing:2,color:'var(--ink)'}}>7100&nbsp;7000&nbsp;0000&nbsp;0042</div>
                <div style={{fontSize:12,color:'var(--ink-3)',marginTop:4}}>CLABE interbancaria · Banco Azteca</div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:16,textAlign:'left'}}>
                <div><div style={{fontSize:11,color:'var(--ink-3)'}}>Beneficiario</div><div style={{fontSize:13,fontWeight:500}}>Escuela EduPago</div></div>
                <div><div style={{fontSize:11,color:'var(--ink-3)'}}>Concepto</div><div style={{fontSize:13,fontFamily:'var(--mono)',fontWeight:600}}>{clienteSel?.nombre||'Pago escolar'}</div></div>
                <div><div style={{fontSize:11,color:'var(--ink-3)'}}>Monto</div><div style={{fontSize:18,fontWeight:700,color:'var(--accent)',fontFamily:'var(--mono)'}}>{fmt(total)}</div></div>
                <div><div style={{fontSize:11,color:'var(--ink-3)'}}>Referencia</div><div style={{fontSize:13,fontFamily:'var(--mono)'}}>{newFolio(data.cobros)}</div></div>
              </div>
              <div style={{fontSize:11,color:'var(--ink-4)',marginBottom:16}}>La verificación es automática vía webhook STP. El cobro se marcará como pagado al recibir la transferencia.</div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setShowSPEI(false)}>Cancelar</button>
              <button className="btn btn-primary" onClick={finalizarCobro}>Confirmar pago recibido</button>
            </div>
          </div>
        </div>
      )}

      {/* Modal CoDi */}
      {showCoDi&&(
        <div className="modal-backdrop">
          <div className="modal">
            <div className="modal-header"><div className="modal-title">Pago CoDi</div><button className="btn btn-ghost btn-sm" onClick={()=>setShowCoDi(false)}>✕</button></div>
            <div className="modal-body" style={{textAlign:'center'}}>
              <div style={{fontSize:13,color:'var(--ink-3)',marginBottom:12}}>Muestra este código QR al cliente para pagar desde su app bancaria</div>
              <div style={{width:160,height:160,background:'var(--ink)',borderRadius:12,margin:'0 auto 12px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,color:'rgba(255,255,255,.4)'}}>
                [QR CoDi<br/>{fmt(total)}]
              </div>
              <div style={{fontSize:18,fontWeight:700,color:'var(--accent)',fontFamily:'var(--mono)',marginBottom:4}}>{fmt(total)}</div>
              <div style={{fontSize:12,color:'var(--ink-3)'}}>Código válido por 5 minutos</div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setShowCoDi(false)}>Cancelar</button>
              <button className="btn btn-primary" onClick={finalizarCobro}>✓ Pago confirmado</button>
            </div>
          </div>
        </div>
      )}

      {/* Ticket */}
      {showTicket&&(
        <div className="modal-backdrop">
          <div className="modal">
            <div className="modal-header"><div className="modal-title">✅ Cobro completado</div></div>
            <div className="modal-body">
              <div className="ticket">
                <div style={{textAlign:'center',marginBottom:8}}>
                  <div style={{fontSize:16,fontWeight:'bold'}}>ESCUELA EDUPAGO</div>
                  <div style={{fontSize:10}}>Folio: {showTicket.folio}</div>
                  <div style={{fontSize:10}}>{fmtDate(showTicket.fecha)}</div>
                </div>
                <hr className="ticket-divider"/>
                <div style={{marginBottom:6,fontSize:11}}>Cliente: {showTicket.cliente}</div>
                <hr className="ticket-divider"/>
                {showTicket.items.map((it,i)=>(
                  <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:3}}>
                    <span>{it.nombre} x{it.qty}</span><span>{fmt(it.precio*it.qty)}</span>
                  </div>
                ))}
                <hr className="ticket-divider"/>
                <div style={{display:'flex',justifyContent:'space-between',fontWeight:'bold',fontSize:13}}>
                  <span>TOTAL</span><span>{fmt(showTicket.total)}</span>
                </div>

                <div style={{textAlign:'center',fontSize:10,marginTop:6}}>Método: {showTicket.metodo}</div>
                <div style={{textAlign:'center',fontSize:10}}>¡Gracias por su pago!</div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>window.print()}>🖨️ Imprimir</button>
              <button className="btn btn-primary" onClick={()=>setShowTicket(null)}>Cerrar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════
   HISTORIAL DE COBROS
══════════════════════════════════════ */
function Cobros({data,setData}){
  const [q,setQ]=useState('');
  const [filtroEstado,setFiltroEstado]=useState('');
  const [filtroMetodo,setFiltroMetodo]=useState('');
  const [detalle,setDetalle]=useState(null);

  const list=data.cobros.filter(c=>{
    if(filtroEstado&&c.estado!==filtroEstado) return false;
    if(filtroMetodo&&c.metodo!==filtroMetodo) return false;
    if(q&&!c.cliente.toLowerCase().includes(q.toLowerCase())&&!c.folio.includes(q)) return false;
    return true;
  }).slice().reverse();

  const totalFiltrado=list.reduce((a,c)=>a+c.total,0);

  const cancelar=id=>setData(d=>({...d,cobros:d.cobros.map(c=>c.id===id?{...c,estado:'cancelado'}:c)}));

  return(
    <div>
      <div className="flex-center mb-16" style={{flexWrap:'wrap',gap:8}}>
        <div className="search-bar" style={{width:240}}>
          <span className="search-icon">🔍</span>
          <input placeholder="Buscar folio o cliente..." value={q} onChange={e=>setQ(e.target.value)}/>
        </div>
        <select className="form-select" style={{width:140}} value={filtroEstado} onChange={e=>setFiltroEstado(e.target.value)}>
          <option value="">Todos los estados</option>
          <option value="pagado">Pagado</option>
          <option value="pendiente">Pendiente</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <select className="form-select" style={{width:130}} value={filtroMetodo} onChange={e=>setFiltroMetodo(e.target.value)}>
          <option value="">Todos los métodos</option>
          <option value="TC">Tarjeta</option>
          <option value="SPEI">SPEI</option>
          <option value="CoDi">CoDi</option>
        </select>
        <div className="ml-auto" style={{fontSize:13,color:'var(--ink-3)'}}>
          {list.length} cobros · <strong style={{color:'var(--ink)'}}>{fmt(totalFiltrado)}</strong>
        </div>
      </div>
      <div className="card">
        <div className="table-wrap">
          <table>
            <thead><tr><th>Folio</th><th>Cliente</th><th>Conceptos</th><th>Total</th><th>Método</th><th>Estado</th><th>Fecha</th><th>Factura</th><th></th></tr></thead>
            <tbody>
              {list.length===0&&<tr><td colSpan={9}><div className="empty-state"><div className="empty-icon">🧾</div><div className="empty-text">Sin cobros</div></div></td></tr>}
              {list.map(c=>(
                <tr key={c.id}>
                  <td><span style={{fontFamily:'var(--mono)',fontSize:12.5,fontWeight:600}}>{c.folio}</span></td>
                  <td style={{fontWeight:500,color:'var(--ink)'}}>{c.cliente}</td>
                  <td style={{fontSize:12,color:'var(--ink-3)'}}>{c.items.map(i=>i.nombre).join(', ')}</td>
                  <td className="text-mono" style={{fontWeight:600}}>{fmt(c.total)}</td>
                  <td><MetodoBadge metodo={c.metodo}/></td>
                  <td><EstadoBadge estado={c.estado}/></td>
                  <td style={{fontSize:12,color:'var(--ink-3)'}}>{fmtDate(c.fecha)}</td>
                  <td>{c.factura?<span className="badge badge-green">✓ Emitida</span>:<span className="badge badge-gray">—</span>}</td>
                  <td>
                    <div style={{display:'flex',gap:4}}>
                      <button className="btn btn-ghost btn-sm" onClick={()=>setDetalle(c)} title="Ver detalle">👁</button>
                      {c.estado==='pendiente'&&<button className="btn btn-danger btn-sm" onClick={()=>cancelar(c.id)}>✕</button>}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {detalle&&(
        <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&setDetalle(null)}>
          <div className="modal">
            <div className="modal-header">
              <div><div className="modal-title">{detalle.folio}</div><div style={{fontSize:12,color:'var(--ink-3)'}}>{fmtDate(detalle.fecha)}</div></div>
              <button className="btn btn-ghost btn-sm" onClick={()=>setDetalle(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="grid-2" style={{marginBottom:16}}>
                <div><div style={{fontSize:11,color:'var(--ink-3)'}}>Cliente</div><div style={{fontWeight:500}}>{detalle.cliente}</div></div>
                <div><div style={{fontSize:11,color:'var(--ink-3)'}}>Método</div><div><MetodoBadge metodo={detalle.metodo}/></div></div>
                <div><div style={{fontSize:11,color:'var(--ink-3)'}}>Estado</div><div><EstadoBadge estado={detalle.estado}/></div></div>
                <div><div style={{fontSize:11,color:'var(--ink-3)'}}>Factura</div><div>{detalle.factura?'✓ Emitida':'No emitida'}</div></div>
              </div>
              <div style={{background:'var(--surface-2)',borderRadius:'var(--radius)',padding:'12px 14px'}}>
                <div style={{fontWeight:600,fontSize:13,marginBottom:10}}>Conceptos cobrados</div>
                {detalle.items.map((it,i)=>(
                  <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--surface-3)',fontSize:13}}>
                    <span>{it.nombre} × {it.qty}</span>
                    <span style={{fontFamily:'var(--mono)',fontWeight:500}}>{fmt(it.precio*it.qty)}</span>
                  </div>
                ))}
                <div style={{display:'flex',justifyContent:'space-between',paddingTop:10,fontWeight:700,fontSize:15}}>
                  <span>Total</span><span style={{fontFamily:'var(--mono)',color:'var(--accent)'}}>{fmt(detalle.total)}</span>
                </div>
              </div>
            </div>
            <div className="modal-footer">
              {!detalle.factura&&detalle.estado==='pagado'&&<button className="btn btn-secondary" onClick={()=>{setData(d=>({...d,cobros:d.cobros.map(c=>c.id===detalle.id?{...c,factura:true}:c)}));setDetalle(d=>({...d,factura:true}));}}>📄 Emitir factura</button>}
              <button className="btn btn-secondary">🖨️ Reimprimir</button>
              <button className="btn btn-primary" onClick={()=>setDetalle(null)}>Cerrar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════
   FACTURACIÓN
══════════════════════════════════════ */
function Facturacion({data,setData}){
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({cobro_id:'',rfc:'',razon_social:'',uso_cfdi:'G03',regimen:'601'});

  const cobrosFacturables=data.cobros.filter(c=>c.estado==='pagado'&&!c.factura);
  const facturadas=data.cobros.filter(c=>c.factura);

  const emitir=()=>{
    setData(d=>({...d,cobros:d.cobros.map(c=>c.id===parseInt(form.cobro_id)?{...c,factura:true}:c)}));
    setModal(null);
  };

  return(
    <div>
      <div className="grid-2 mb-24">
        <div className="stat-card"><div className="stat-icon" style={{background:'#eff4ff'}}>📄</div><div className="stat-label">Facturas emitidas</div><div className="stat-value">{facturadas.length}</div></div>
        <div className="stat-card"><div className="stat-icon" style={{background:'#fffbeb'}}>⏳</div><div className="stat-label">Pendientes de facturar</div><div className="stat-value">{cobrosFacturables.length}</div></div>
      </div>

      <div className="flex-center mb-16">
        <div className="card-title">Cobros sin factura</div>
        <div className="ml-auto"><button className="btn btn-primary" onClick={()=>setModal('new')}>+ Nueva factura</button></div>
      </div>

      <div className="card mb-24">
        <div className="table-wrap">
          <table>
            <thead><tr><th>Folio</th><th>Cliente</th><th>Total</th><th>Fecha</th><th></th></tr></thead>
            <tbody>
              {cobrosFacturables.length===0&&<tr><td colSpan={5}><div className="empty-state"><div className="empty-icon">✅</div><div className="empty-text">Todos los cobros están facturados</div></div></td></tr>}
              {cobrosFacturables.map(c=>(
                <tr key={c.id}>
                  <td className="text-mono" style={{fontWeight:600}}>{c.folio}</td>
                  <td>{c.cliente}</td>
                  <td className="text-mono">{fmt(c.total)}</td>
                  <td style={{fontSize:12,color:'var(--ink-3)'}}>{fmtDate(c.fecha)}</td>
                  <td><button className="btn btn-primary btn-sm" onClick={()=>{setForm(f=>({...f,cobro_id:c.id}));setModal('new');}}>Facturar</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="card-title mb-16">Facturas emitidas</div>
      <div className="card">
        <div className="table-wrap">
          <table>
            <thead><tr><th>Folio cobro</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead>
            <tbody>
              {facturadas.length===0&&<tr><td colSpan={4}><div className="empty-state"><div className="empty-icon">📄</div><div className="empty-text">Sin facturas emitidas</div></div></td></tr>}
              {facturadas.map(c=>(
                <tr key={c.id}><td className="text-mono" style={{fontWeight:600}}>{c.folio}</td><td>{c.cliente}</td><td className="text-mono">{fmt(c.total)}</td><td><span className="badge badge-green">✓ Timbrada</span></td></tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {modal&&(
        <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal">
            <div className="modal-header"><div className="modal-title">Nueva factura (CFDI)</div><button className="btn btn-ghost btn-sm" onClick={()=>setModal(null)}>✕</button></div>
            <div className="modal-body">
              <div className="form-group">
                <label className="form-label">Cobro a facturar</label>
                <select className="form-select" value={form.cobro_id} onChange={e=>setForm(f=>({...f,cobro_id:e.target.value}))}>
                  <option value="">Seleccionar cobro...</option>
                  {cobrosFacturables.map(c=><option key={c.id} value={c.id}>{c.folio} — {c.cliente} — {fmt(c.total)}</option>)}
                </select>
              </div>
              <div className="form-row">
                <div className="form-group"><label className="form-label">RFC</label><input className="form-input" value={form.rfc} onChange={e=>setForm(f=>({...f,rfc:e.target.value.toUpperCase()}))} placeholder="RFC del receptor"/></div>
                <div className="form-group"><label className="form-label">Razón social</label><input className="form-input" value={form.razon_social} onChange={e=>setForm(f=>({...f,razon_social:e.target.value}))}/></div>
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Uso del CFDI</label>
                  <select className="form-select" value={form.uso_cfdi} onChange={e=>setForm(f=>({...f,uso_cfdi:e.target.value}))}>
                    <option value="G03">G03 — Gastos en general</option>
                    <option value="D10">D10 — Pagos por servicios educativos</option>
                    <option value="S01">S01 — Sin efectos fiscales</option>
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Régimen fiscal</label>
                  <select className="form-select" value={form.regimen} onChange={e=>setForm(f=>({...f,regimen:e.target.value}))}>
                    <option value="601">601 — Ley general personas morales</option>
                    <option value="612">612 — Personas físicas con actividades</option>
                    <option value="616">616 — Sin obligaciones fiscales</option>
                  </select>
                </div>
              </div>
              <div style={{background:'var(--amber-light)',border:'1px solid #fde68a',borderRadius:'var(--radius-sm)',padding:'8px 12px',fontSize:12,color:'#92400e'}}>
                ⚠️ La factura se timbrará vía Facturapi. Conecta tu cuenta en Configuración antes de emitir.
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setModal(null)}>Cancelar</button>
              <button className="btn btn-primary" onClick={emitir} disabled={!form.cobro_id||!form.rfc}>Timbrar CFDI</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Emails({data,setData}){

  const enviar=()=>{
    const e={id:newId(data.emails),tipo:'enviado',asunto:form.asunto,para:form.para,fecha:new Date().toISOString().slice(0,10),estado:'entregado'};
    setData(d=>({...d,emails:[...d.emails,e]}));

                  </tr>

          <div className="table-wrap">
            <table>
              <thead><tr><th>Para</th><th>Asunto</th><th>Fecha</th><th>Estado</th></tr></thead>

                {data.emails.filter(e=>e.tipo==='enviado').map(e=>(
                  <tr key={e.id}>
                    <td style={{fontSize:12,color:'var(--ink-3)'}}>{e.para}</td>
                    <td>{e.asunto}</td>
                    <td style={{fontSize:12,color:'var(--ink-3)'}}>{fmtDate(e.fecha)}</td>

                      {t.icon} {t.label}

                </div>
              </div>
              <div className="form-group"><label className="form-label">Para *</label><input className="form-input" type="email" value={form.para} onChange={e=>setForm(f=>({...f,para:e.target.value}))} placeholder="destinatario@mail.com"/></div>
              <div className="form-group"><label className="form-label">Asunto *</label><input className="form-input" value={form.asunto} onChange={e=>setForm(f=>({...f,asunto:e.target.value}))} placeholder="Asunto del mensaje"/></div>
              <div className="form-group"><label className="form-label">Mensaje</label><textarea className="form-textarea" value={form.cuerpo} onChange={e=>setForm(f=>({...f,cuerpo:e.target.value}))} rows={5} placeholder="Cuerpo del mensaje..."/></div>

            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setModal(false)}>Cancelar</button>
              <button className="btn btn-primary" onClick={enviar} disabled={!form.para||!form.asunto}>📨 Enviar email</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════
   REPORTES
══════════════════════════════════════ */
function Reportes({data}){
  const total=data.cobros.filter(c=>c.estado==='pagado').reduce((a,c)=>a+c.total,0);
  const pendiente=data.cobros.filter(c=>c.estado==='pendiente').reduce((a,c)=>a+c.total,0);
  const porMetodo={TC:0,SPEI:0,CoDi:0};
  data.cobros.filter(c=>c.estado==='pagado').forEach(c=>{ if(porMetodo[c.metodo]!==undefined) porMetodo[c.metodo]+=c.total; });
  const maxMetodo=Math.max(...Object.values(porMetodo));
  const porConcepto={};
  data.cobros.filter(c=>c.estado==='pagado').forEach(c=>c.items.forEach(it=>{ porConcepto[it.nombre]=(porConcepto[it.nombre]||0)+it.precio*it.qty; }));
  const topConceptos=Object.entries(porConcepto).sort((a,b)=>b[1]-a[1]);
  const maxConcepto=topConceptos[0]?.[1]||1;

  return(
    <div>
      <div className="flex-center mb-16">
        <div style={{fontSize:13,color:'var(--ink-3)'}}>Período: Mayo 2026</div>
        <div className="ml-auto">
          <button className="btn btn-secondary">📥 Exportar Excel</button>
        </div>
      </div>
      <div className="stats-grid mb-24">
        {[
          {label:'Total cobrado',val:fmt(total),icon:'💰',bg:'#eff4ff'},
          {label:'Por cobrar',val:fmt(pendiente),icon:'⏳',bg:'#fffbeb'},
          {label:'Total cobros',val:data.cobros.length,icon:'📋',bg:'#ecfdf5'},
          {label:'Facturas emitidas',val:data.cobros.filter(c=>c.factura).length,icon:'📄',bg:'#f5f3ff'},
        ].map((s,i)=>(
          <div className="stat-card" key={i}>
            <div className="stat-icon" style={{background:s.bg}}>{s.icon}</div>
            <div className="stat-label">{s.label}</div>
            <div className="stat-value">{s.val}</div>
          </div>
        ))}
      </div>
      <div className="grid-2">
        <div className="card">
          <div className="card-header"><div className="card-title">Cobrado por método de pago</div></div>
          <div className="bar-chart">
            {Object.entries(porMetodo).map(([k,v])=>(
              <div className="bar-row" key={k}>
                <div className="bar-label" style={{textAlign:'left',minWidth:80}}>{k}</div>
                <div className="bar-track"><div className="bar-fill" style={{width:maxMetodo>0?v/maxMetodo*100+'%':'0%'}}/></div>
                <div className="bar-val">{fmt(v)}</div>
              </div>
            ))}
          </div>
        </div>
        <div className="card">
          <div className="card-header"><div className="card-title">Conceptos más cobrados</div></div>
          <div className="bar-chart">
            {topConceptos.slice(0,6).map(([k,v])=>(
              <div className="bar-row" key={k}>
                <div className="bar-label" style={{textAlign:'left',minWidth:120,fontSize:11}}>{k.length>18?k.slice(0,18)+'…':k}</div>
                <div className="bar-track"><div className="bar-fill" style={{width:v/maxConcepto*100+'%',background:'var(--purple)'}}/></div>
                <div className="bar-val">{fmt(v)}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   APP SHELL
══════════════════════════════════════ */
const NAV=[
  {id:'dashboard',label:'Dashboard',icon:'📊',admin:false},
  {id:'caja',label:'Caja de cobros',icon:'🏪',admin:false},
  {id:'cobros',label:'Historial de cobros',icon:'🧾',admin:false},
  {id:'clientes',label:'Clientes',icon:'👥',admin:false},
  {id:'productos',label:'Conceptos de pago',icon:'💡',admin:true},
  {id:'facturacion',label:'Facturación',icon:'📄',admin:false},
  {id:'emails',label:'Emails',icon:'📨',admin:false},
  {id:'reportes',label:'Reportes',icon:'📈',admin:false},
];

const TITLES={
  dashboard:'Dashboard',caja:'Caja de cobros',cobros:'Historial de cobros',
  clientes:'Clientes',productos:'Conceptos de pago',facturacion:'Facturación',
  emails:'Emails y recordatorios',reportes:'Reportes',
};

function App(){
  const [user,setUser]=useState(null);
  const [page,setPage]=useState('dashboard');
  const [data,setData]=useState(INIT_DATA);
  const [theme, setTheme]=useState('dark');

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  if(!user) return <Login onLogin={u=>{setUser(u);setPage('dashboard');}}/>;

  const navItems=NAV.filter(n=>!n.admin||user.rol==='admin');
  const pendientes=data.cobros.filter(c=>c.estado==='pendiente').length;
  const emailsNuevos=data.emails.filter(e=>e.tipo==='recibido'&&!e.leido).length;

  const renderPage=()=>{
    switch(page){
      case 'dashboard': return <Dashboard data={data} user={user}/>;
      case 'caja': return <Caja data={data} setData={setData} user={user}/>;
      case 'cobros': return <Cobros data={data} setData={setData}/>;
      case 'clientes': return <Clientes data={data} setData={setData}/>;
      case 'productos': return <Productos data={data} setData={setData}/>;
      case 'facturacion': return <Facturacion data={data} setData={setData}/>;
      case 'emails': return <Emails data={data} setData={setData}/>;
      case 'reportes': return <Reportes data={data}/>;
      default: return null;
    }
  };

  return(
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-brand">
          <div className="brand-logo">
            <div className="brand-icon">🎓</div>
            <div><div className="brand-name">EduPago</div><div className="brand-sub">Sistema escolar</div></div>
          </div>
        </div>
        <nav className="sidebar-nav">
          <div className="nav-section-label">Principal</div>
          {navItems.map(n=>(
            <div key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>setPage(n.id)}>
              <span className="nav-icon">{n.icon}</span>
              {n.label}
              {n.id==='cobros'&&pendientes>0&&<span className="nav-badge">{pendientes}</span>}
              {n.id==='emails'&&emailsNuevos>0&&<span className="nav-badge">{emailsNuevos}</span>}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="user-card">
            <div className={`avatar ${user.rol==='admin'?'avatar-admin':'avatar-user'}`}>{user.nombre.charAt(0)}</div>
            <div className="user-info">
              <div className="user-name">{user.nombre}</div>
              <div className="user-role">{user.rol==='admin'?'Administrador':'Cajero'}</div>
            </div>
            <div className="logout-btn" onClick={()=>setUser(null)} title="Cerrar sesión">⏻</div>
          </div>
        </div>
      </aside>
      <div className="main">
        <header className="topbar">
          <div>
            <span className="topbar-title">{TITLES[page]}</span>
          </div>
          <div className="topbar-actions">
            <button 
              className="btn btn-secondary btn-sm" 
              onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
              style={{ padding: '6px 10px', fontSize: 16 }}
              title="Cambiar tema"
            >
              {theme === 'dark' ? '☀️' : '🌙'}
            </button>
            <div style={{fontSize:12,color:'var(--ink-3)',padding:'4px 10px',background:'var(--bg-surface-2)',borderRadius:20,border:'1px solid var(--border-glow)'}}>
              Mayo 2026
            </div>
            {page!=='caja'&&(
              <button className="btn btn-primary btn-sm" onClick={()=>setPage('caja')}>
                + Nuevo cobro
              </button>
            )}
          </div>
        </header>
        <main className="content">
          {renderPage()}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
