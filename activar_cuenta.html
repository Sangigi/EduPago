<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Activar cuenta · Paga la Escuela</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Página pública independiente — no carga assets/css/main.css a propósito
     (ver 5.3w en PRODUCCION.md): son 4 variables nada más, y ese archivo pesa
     ~53 KB pensado para toda la SPA. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { overflow: auto; font-family: 'Google Sans', system-ui, -apple-system, sans-serif; }
  .reg-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center;
              padding:28px 18px; background:#49af54; }
  .reg-card { width:100%; max-width:440px; background:#214f26; color:#ffffff;
              border:1px solid rgba(255,255,255,.2); border-radius:16px;
              box-shadow:0 16px 44px rgba(0,0,0,.38); overflow:hidden; }
  .reg-top  { padding:28px 30px 22px; text-align:center; }
  .reg-marca{ font-size:24px; font-weight:800; letter-spacing:-.8px; }
  .reg-sub  { font-size:12px; color:#d2e3d6; font-weight:600; margin-top:4px; }
  .reg-body { padding:0 30px 28px; }
  .reg-h    { font-size:17px; font-weight:700; margin:0 0 4px; }
  .reg-p    { font-size:13px; color:#d2e3d6; margin:0 0 20px; line-height:1.55; }
  .reg-campo{ margin-bottom:14px; }
  .reg-campo label { display:block; font-size:12px; font-weight:600;
                     color:rgba(255,255,255,.8); margin-bottom:5px; }
  .reg-campo input {
    width:100%; padding:11px 13px; border-radius:9px;
    border:1px solid rgba(255,255,255,.14); background:#fff; color:#1e2430;
    font-size:14px; font-family:inherit; outline:none;
  }
  .reg-campo input:focus {
    border-color:#ffffff; box-shadow:0 0 0 3px rgba(255,255,255,.22);
  }
  .reg-btn  { width:100%; margin-top:8px; padding:13px; border:none;
              border-radius:9px; cursor:pointer; color:#0e2414;
              font-size:14px; font-weight:700; font-family:inherit;
              background:#51ba5a;
              }
  .reg-btn:disabled { opacity:.55; cursor:not-allowed; }
  .reg-msg  { margin-top:14px; padding:11px 14px; border-radius:9px;
              font-size:13px; line-height:1.5; }
  .reg-err  { background:rgba(194,59,46,.38); color:#ffd9d4; }
  .reg-pie  { text-align:center; font-size:11px; color:#bcd2c1; margin-top:18px; }
  .reg-estado { text-align:center; padding:34px 30px 40px; }
  .reg-estado-ic { font-size:38px; line-height:1; margin-bottom:14px; }
</style>
</head>
<body>
<div class="reg-wrap"><div class="reg-card" id="app">
  <div class="reg-top">
    <div class="reg-marca">Paga la Escuela</div>
    <div class="reg-sub">ACTIVAR CUENTA</div>
  </div>
  <div class="reg-body" id="cuerpo">
    <p class="reg-p">Verificando tu enlace…</p>
  </div>
</div></div>

<script src="assets/js/activar_cuenta.js?v=1787400000"></script>
</body>
</html>
