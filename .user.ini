; Asegura que Hostinger no rechace subidas (foto de alumno, comprobante de
; gasto) por debajo de nuestros propios límites (ver UPLOADS_MAX_BYTES_* en
; config.php). Sin esto, PHP puede rechazar el archivo ANTES de que
; $_FILES se llene, con un límite por defecto más chico que el anunciado.
upload_max_filesize = 8M
post_max_size = 10M
