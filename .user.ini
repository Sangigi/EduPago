; Asegura que Hostinger no rechace subidas (foto de alumno, comprobante de
; gasto, documentos de alta de comercio) por debajo de nuestros propios
; límites (ver UPLOADS_MAX_BYTES_* en config.php). Sin esto, PHP puede
; rechazar el archivo ANTES de que $_FILES se llene, con un límite por
; defecto más chico que el anunciado. 10M porque los documentos de alta de
; comercio (Cobroscontarjeta.com) piden ese tope.
upload_max_filesize = 10M
post_max_size = 12M
